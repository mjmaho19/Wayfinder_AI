<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wayfinder – Dashboard</title>

  <!-- NOTE: API key exposed; keep as-is per your note, but fix later -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAUb3y_iv4wLZsd9eiFsmHqipmYbL9p5X4&callback=initMap&loading=async" defer></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f0f11;
      --surface:  #17171a;
      --surface2: #1e1e23;
      --border:   rgba(255,255,255,0.07);
      --text:     #e8e8ec;
      --muted:    #7c7c8a;
      --accent:   #5b8dff;
      --accent2:  #a78bfa;
      --green:    #34d399;
      --amber:    #fbbf24;
      --radius:   16px;
      --radius-sm:10px;
      --shadow:   0 8px 32px rgba(0,0,0,0.45);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    /* ─── HEADER ─────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      height: 58px;
      background: rgba(15,15,17,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      position: relative;
      z-index: 20;
    }

    .logo {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .logo-word {
      font-family: 'Instrument Serif', serif;
      font-size: 22px;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .logo-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      margin-bottom: 2px;
    }
    .logo-tag {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-left: 4px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 5px 14px;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .pill .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
    }

    /* ─── LAYOUT ─────────────────────────────── */
    .app {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 58px);
      padding: 20px;
      gap: 16px;
    }

    /* top row: map + sidebar */
    .top-row {
      display: flex;
      gap: 16px;
      flex: 0 0 auto;
      height: 52vh;
      min-height: 320px;
    }

    /* ─── MAP ────────────────────────────────── */
    .map-wrapper {
      flex: 1;
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
    }

    #map {
      width: 100%;
      height: 100%;
      background: #141820;
      position: relative;
      overflow: hidden;
    }

    .map-overlay-tl {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }
    .map-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(23,23,26,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      width: 280px;
    }
    .map-search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      width: 100%;
    }
    .map-search input::placeholder { color: var(--muted); }
    .map-search svg { flex-shrink: 0; }

    .map-controls {
      position: absolute;
      bottom: 14px;
      right: 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 5;
    }
    .map-btn {
      width: 36px; height: 36px;
      background: rgba(23,23,26,0.92);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: grid;
      place-items: center;
      cursor: pointer;
      color: var(--muted);
      transition: color .2s, border-color .2s;
    }
    .map-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.18); }

    /* Pin markers (legacy container kept; you use Google Markers now) */
    .pin {
      position: absolute;
      transform: translate(-50%, -100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity .3s, transform .3s;
      z-index: 4;
    }
    .pin.visible { opacity: 1; }

    /* ─── SIDEBAR BUTTONS ────────────────────── */
    .sidebar {
      width: 72px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .filter-btn {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .15s;
      position: relative;
      overflow: hidden;
      color: var(--muted);
    }
    .filter-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .2s;
    }
    .filter-btn:hover { transform: scale(1.03); color: var(--text); }
    .filter-btn:hover::before { opacity: 1; }

    .filter-btn.active {
      border-color: transparent;
      color: #fff;
    }
    .filter-btn.active::before { opacity: 1; }

    .filter-btn[data-type="restaurant"]::before { background: linear-gradient(160deg, rgba(255,107,107,.25), rgba(255,107,107,.05)); }
    .filter-btn[data-type="restaurant"].active { background: rgba(255,107,107,.18); border-color: rgba(255,107,107,.4); }
    .filter-btn[data-type="shop"]::before { background: linear-gradient(160deg, rgba(91,141,255,.25), rgba(91,141,255,.05)); }
    .filter-btn[data-type="shop"].active { background: rgba(91,141,255,.18); border-color: rgba(91,141,255,.4); }
    .filter-btn[data-type="hotel"]::before { background: linear-gradient(160deg, rgba(167,139,250,.25), rgba(167,139,250,.05)); }
    .filter-btn[data-type="hotel"].active { background: rgba(167,139,250,.18); border-color: rgba(167,139,250,.4); }
    .filter-btn[data-type="bathroom"]::before { background: linear-gradient(160deg, rgba(52,211,153,.25), rgba(52,211,153,.05)); }
    .filter-btn[data-type="bathroom"].active { background: rgba(52,211,153,.18); border-color: rgba(52,211,153,.4); }
    .filter-btn[data-type="poi"]::before { background: linear-gradient(160deg, rgba(251,191,36,.25), rgba(251,191,36,.05)); }
    .filter-btn[data-type="poi"].active { background: rgba(251,191,36,.18); border-color: rgba(251,191,36,.4); }

    .filter-icon { font-size: 22px; line-height: 1; }
    .filter-label { font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }

    /* ─── RESULTS PANEL ──────────────────────── */
    .results-panel {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .results-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .results-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .results-count {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 2px 9px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }
    .results-meta {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .results-list {
      overflow-y: auto;
      flex: 1;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .results-list::-webkit-scrollbar { width: 4px; }
    .results-list::-webkit-scrollbar-track { background: transparent; }
    .results-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* Empty / placeholder state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      padding: 40px;
      text-align: center;
    }
    .empty-icon { font-size: 36px; opacity: .4; }
    .empty-text { font-size: 13px; line-height: 1.5; }

    /* ─── RESULT CARD ────────────────────────── */
    .card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      animation: cardIn .25s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.14);
    }

    .card-icon {
      width: 40px; height: 40px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .card-body { flex: 1; min-width: 0; }
    .card-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }
    .card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-shrink: 0;
    }
    .badge {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }
    .stars {
      color: var(--amber);
      font-size: 11px;
      letter-spacing: -1px;
    }
    .dist {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
    }

    /* ─── COLUMN HEADERS ─────────────────────── */
    .col-headers {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px 8px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .col-headers .ch-name { flex: 1; padding-left: 54px; }
    .col-headers .ch-right { display: flex; gap: 24px; font-size: 10px; }
  </style>
</head>
<body>

<!-- ─── HEADER ──────────────────────────────────── -->
<header>
  <div class="logo">
    <span class="logo-word">Wayfinder</span>
    <div class="logo-dot"></div>
    <span class="logo-tag">Beta</span>
  </div>
  <div class="header-right">
    <div class="pill">
      <span class="status-dot"></span>
      Within 10 mi · San Francisco, CA
    </div>
    <div class="avatar" id="chat-trigger" onclick="toggleChat()" title="Travel Assistant" style="cursor:pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
  </div>
</header>

<!-- CHAT PANEL -->
<div id="chat-panel" style="
  position:fixed;bottom:24px;right:24px;
  width:360px;height:500px;
  background:#17171a;border:1px solid rgba(255,255,255,0.07);
  border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.6);
  display:none;flex-direction:column;z-index:100;overflow:hidden;">

  <div style="padding:14px 18px;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between;">
    <span style="font-weight:600;font-size:14px;color:#e8e8ec;">Travel Assistant</span>
    <span onclick="toggleChat()" style="cursor:pointer;color:#7c7c8a;font-size:18px;line-height:1;">&times;</span>
  </div>

  <div id="chat-messages" style="flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;"></div>

  <div style="padding:12px;border-top:1px solid rgba(255,255,255,0.07);display:flex;gap:8px;">
    <input id="chat-input" type="text" placeholder="Ask about your trip…" onkeydown="if(event.key==='Enter')sendChat()" style="
      flex:1;background:#1e1e23;border:1px solid rgba(255,255,255,0.07);
      border-radius:8px;padding:8px 12px;color:#e8e8ec;font-size:13px;
      font-family:inherit;outline:none;">
    <button onclick="sendChat()" style="
      background:#5b8dff;border:none;border-radius:8px;
      padding:8px 14px;color:#fff;font-size:13px;
      cursor:pointer;font-family:inherit;">Send</button>
  </div>
</div>

<!-- ─── CHATBOT ────────────────────────────────── -->
<script>
let chatOpen = false;
let chatHistory = [];

let activeSubmissionId = null;
let pendingEdit = null; // major trip rebuild edits

let pendingProposedEdit = null; // specific itinerary edit from backend

/**
 * Option C support:
 * - Keep an active submission id for the chat session
 * - When a major edit is detected, ask the user to type "confirm"
 * - On confirm, POST /api/chat with apply_changes + edit object
 * - If backend returns new_submission_id, switch the active submission id
 */

function toggleChat() {
  chatOpen = !chatOpen;
  const panel = document.getElementById('chat-panel');
  panel.style.display = chatOpen ? 'flex' : 'none';
}

function appendMessage(role, text) {
  const el = document.createElement('div');
  el.style.cssText = `
    padding:10px 13px;border-radius:10px;font-size:13px;line-height:1.5;max-width:88%;
    ${role === 'user'
      ? 'background:#5b8dff;color:#fff;align-self:flex-end;'
      : 'background:#1e1e23;color:#e8e8ec;align-self:flex-start;border:1px solid rgba(255,255,255,0.07);'}
  `;
  el.textContent = text;
  document.getElementById('chat-messages').appendChild(el);
  document.getElementById('chat-messages').scrollTop = 999999;
}

function isConfirmMessage(text) {
  const t = (text || "").toLowerCase();

  const keywords = [
    "confirm",
    "apply",
    "go ahead",
    "do it",
    "make the change",
    "sounds good",
    "that works",
    "yes"
  ];

  return keywords.some(k => t.includes(k));
}

/**
 * Very simple heuristic: detects destination change intent.
 * Examples it catches:
 * - "change my trip to Los Angeles"
 * - "change destination to LA"
 * - "can I change my trip to Los Angeles?"
 */

 function cleanDestinationText(dest) {
  let d = (dest || "").trim();

  d = d.replace(/^[Aa]\s+trip\s+to\s+/i, "");
  d = d.replace(/^[Tt]rip\s+to\s+/i, "");
  d = d.replace(/^[Tt]o\s+/i, "");
  d = d.replace(/\?+$/g, "");
  d = d.replace(/\.+$/g, "");
  d = d.replace(/\s+instead$/i, "");
  d = d.trim();

  return d;
}

function extractMajorEdit(text) {
  const t = (text || "").trim();

  const patterns = [
    /change (my )?(trip|destination)( to)? (.+)$/i,
    /can i change (my )?(trip|destination)( to)? (.+)$/i,
    /let'?s go to (.+)$/i,
    /make it (.+)$/i
  ];

  for (const re of patterns) {
    const m = t.match(re);
    if (m) {
      const rawDest = (m[m.length - 1] || "").trim();
      const dest = cleanDestinationText(rawDest);
      if (dest.length >= 2) return { desired_destination: dest };
    }
  }

  return null;
}

async function getLatestContext() {
  const res = await fetch('/api/latest', { cache: 'no-store' });
  const json = await res.json();
  const latest = json?.latest || null;

  return {
    ok: Boolean(json?.ok && latest),
    latest,
    latestId: latest?.id ?? null,
    planContext: latest?.plan?.plan_json ?? ''
  };
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  appendMessage('user', text);
  chatHistory.push({ role: 'user', content: text });

  // Show thinking bubble immediately
  appendMessage('assistant', '…');
  const msgs = document.getElementById('chat-messages');
  const thinking = msgs.lastChild;

  // Ensure we have an active submission id for this chat session
  // (only set it once; do NOT reset it each message)
  let planContext = '';
  try {
    const ctx = await getLatestContext();

    if (!ctx.ok) {
      thinking.textContent = "No trip found yet. Submit a trip request first.";
      return;
    }

    // If chat hasn't been "bound" yet, bind it to latest
    if (!activeSubmissionId) {
      activeSubmissionId = ctx.latestId;
    }

    // Plan context should match the active submission.
    // We only have /api/latest, so:
    // - if activeSubmissionId === latestId: use latest plan_json
    // - else: send empty plan_context (backend can still handle chat)
    if (activeSubmissionId === ctx.latestId) {
      planContext = ctx.planContext || '';
    } else {
      planContext = '';
    }

  } catch (e) {
    console.warn("Failed to load /api/latest:", e);
    thinking.textContent = "Couldn't load your trip context. Try refreshing the page.";
    return;
  }

  // --- Option C confirmation flow ---
  const maybeEdit = extractMajorEdit(text);

  // If user typed an edit request, store it and ask to confirm
  if (maybeEdit && !isConfirmMessage(text)) {
    pendingEdit = {
      ...(pendingEdit || {}),
      ...maybeEdit
    };

    const dest = pendingEdit.desired_destination || "that destination";
    const confirmMsg =
      `Got it — you want to change your trip to ${dest}.\n\n` +
      `Type "confirm" to apply this change.`;

    thinking.textContent = confirmMsg;
    chatHistory.push({ role: 'assistant', content: confirmMsg });
    return;
  }

  const confirming = isConfirmMessage(text);

  const applyingSpecificEdit = confirming && pendingProposedEdit;
  const applyingMajorEdit = confirming && !pendingProposedEdit && pendingEdit;

  const payload = {
    submission_id: activeSubmissionId,
    messages: chatHistory,
    plan_context: planContext,
    ...(applyingSpecificEdit
      ? { apply_specific_edit: true, proposed_edit: pendingProposedEdit }
      : {}),
    ...(applyingMajorEdit
      ? { apply_changes: true, edit: pendingEdit }
      : {})
  };

  console.log("POST /api/chat payload:", payload);

  try {
    const chatRes = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    const raw = await chatRes.text();
    console.log("chat status:", chatRes.status, chatRes.headers.get("content-type"));
    console.log("chat raw response:", raw);

    if (!chatRes.ok) {
      thinking.textContent = `Chat failed (HTTP ${chatRes.status}).`;
      return;
    }

    let chatJson;
    try {
      chatJson = JSON.parse(raw);
    } catch (e) {
      thinking.textContent = "Chat returned invalid JSON.";
      return;
    }

    const reply = chatJson?.reply ?? "No reply.";
    thinking.textContent = reply;
    chatHistory.push({ role: 'assistant', content: reply });

    if (chatJson?.proposed_edit) {
      pendingProposedEdit = chatJson.proposed_edit;
    }

    if (chatJson?.applied_specific_edit) {
      pendingProposedEdit = null;
      chatHistory = chatHistory.slice(-2);
      try { pollLatest(); } catch (e) {}
    }

    // If backend created a new submission, switch the active one
    if (chatJson?.new_submission_id) {
      activeSubmissionId = chatJson.new_submission_id;
      pendingEdit = null;
      pendingProposedEdit = null;
      chatHistory = [];

      // optional: clear currentType selection so the new destination starts clean
      currentType = null;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));

      // pull fresh /api/latest immediately (your interval will also catch it)
            try { pollLatest(); } catch (e) {}
    }

  } catch (e) {
    console.warn("Chat request failed:", e);
    thinking.textContent = 'Something went wrong. Try again.';
  }
}
</script>

            </svg>
            <input type="text" placeholder="Search locations…" />
          </div>
        </div>

        <!-- Map controls -->
        <div class="map-controls">
          <div class="map-btn" title="Zoom in" onclick="wayfinder_mapZoom(1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </div>
          <div class="map-btn" title="Zoom out" onclick="wayfinder_mapZoom(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </div>
          <div class="map-btn" title="Re-center" onclick="wayfinder_recenter()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR FILTERS -->
    <div class="sidebar">
      <button class="filter-btn" data-type="restaurant" title="Restaurants">
        <span class="filter-icon">🍽️</span>
        <span class="filter-label">Eat</span>
      </button>
      <button class="filter-btn" data-type="shop" title="Shops">
        <span class="filter-icon">🛍️</span>
        <span class="filter-label">Shop</span>
      </button>
      <button class="filter-btn" data-type="hotel" title="Hotels">
        <span class="filter-icon">🏨</span>
        <span class="filter-label">Stay</span>
      </button>
      <button class="filter-btn" data-type="bathroom" title="Bathrooms">
        <span class="filter-icon">🚻</span>
        <span class="filter-label">WC</span>
      </button>
      <button class="filter-btn" data-type="poi" title="Points of Interest">
        <span class="filter-icon">📍</span>
        <span class="filter-label">Explore</span>
      </button>
    </div>
  </div>

  <!-- BOTTOM: Results panel -->
  <div class="results-panel">
    <div class="results-header">
      <div class="results-title">
        <span id="results-label">Nearby Locations</span>
        <span class="results-count" id="results-count">—</span>
      </div>
      <div class="results-meta">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        Within 10 miles · Sorted by distance
      </div>
    </div>

    <!-- Column headers (shown when results are visible) -->
    <div class="col-headers" id="col-headers" style="display:none">
      <span class="ch-name" id="ch-name">Name</span>
      <div class="ch-right" id="ch-right"></div>
    </div>

    <div class="results-list" id="results-list">
      <div class="empty-state">
        <div class="empty-icon">🗺️</div>
        <div class="empty-text">Select a category from the sidebar<br/>to explore nearby locations</div>
      </div>
    </div>
  </div>

</div>

<script>
/**
 * Wayfinder dashboard:
 * - Polls /api/latest
 * - Reads ToolResult where tool_name === "places"
 * - Parses result_json
 * - Groups payload.items by item.type into UI categories:
 *     restaurant, shop, hotel, bathroom, poi
 */

const accentColors = {
  restaurant: { bg: "rgba(255,107,107,.18)", fg: "#ff6b6b" },
  shop:       { bg: "rgba(91,141,255,.18)",  fg: "#5b8dff" },
  hotel:      { bg: "rgba(167,139,250,.18)", fg: "#a78bfa" },
  bathroom:   { bg: "rgba(52,211,153,.18)",  fg: "#34d399" },
  poi:        { bg: "rgba(251,191,36,.18)",  fg: "#fbbf24" },
};

const labels = {
  restaurant: "Restaurants",
  shop: "Shops",
  hotel: "Hotels",
  bathroom: "Restrooms",
  poi: "Points of Interest"
};

const colHeaders = {
  restaurant: { right: ["Type","Price","Rating","Distance"] },
  shop:       { right: ["Rating","Distance"] },
  hotel:      { right: ["Price/Night","Rating","Distance"] },
  bathroom:   { right: ["Type","Distance"] },
  poi:        { right: ["Distance"] },
};

// ---- Data store ----
let data = {
  restaurant: [],
  shop: [],
  hotel: [],
  bathroom: [],
  poi: [],
};

let currentType = null;
let lastSubmissionId = null;

// ---- UI helpers ----
function setEmptyState() {
  currentType = null;
  document.getElementById('pins').innerHTML = '';
  document.getElementById('results-list').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🗺️</div>
      <div class="empty-text">No submission yet.<br/>Submit a trip request to see results here.</div>
    </div>`;
  document.getElementById('results-label').textContent = 'Nearby Locations';
  document.getElementById('results-count').textContent = '—';
  document.getElementById('col-headers').style.display = 'none';
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
}

function setSelectPromptState() {
  currentType = null;
  document.getElementById('pins').innerHTML = '';
  document.getElementById('results-list').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">🗺️</div>
      <div class="empty-text">Select a category from the sidebar<br/>to explore nearby locations</div>
    </div>`;
  document.getElementById('results-label').textContent = 'Nearby Locations';
  document.getElementById('results-count').textContent = '—';
  document.getElementById('col-headers').style.display = 'none';
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
}

function setButtonsEnabled(enabledTypesSet) {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const t = btn.dataset.type;
    const hasData = enabledTypesSet.has(t);
    btn.disabled = !hasData;
    btn.style.opacity = hasData ? '1' : '0.35';
    btn.style.cursor = hasData ? 'pointer' : 'not-allowed';
  });
}

// ---- Rendering ----
function starsHTML(rating) {
  const r = Number(rating);
  if (!Number.isFinite(r)) return '';
  const full = Math.round(r);
  return '★'.repeat(full) + '☆'.repeat(5-full) + ` ${r}`;
}

function _fmtDistance(item) {
  if (item.dist) return item.dist;
  const dm = item.distance_mi;
  if (typeof dm === 'number') return `${dm} mi`;
  if (typeof dm === 'string' && dm.trim()) return dm;
  return '—';
}

function _normalizeForUI(item, type) {
  const out = { ...item };
  out.name = out.name ?? 'Unknown';

  if (type === 'restaurant') {
    out.sub = out.sub ?? out.cuisine ?? out.primary_type ?? 'Restaurant';
  }
  if (type === 'bathroom') {
    out.sub = out.sub ?? out.note ?? 'Public';
  }
  if (type === 'hotel') {
    if (out.price && typeof out.price === 'number') out.price = `$${out.price}/night`;
    if (out.price_per_night && typeof out.price_per_night === 'number') out.price = `$${out.price_per_night}/night`;
  }

  out.dist = _fmtDistance(out);

  const iconDefaults = {
    restaurant: '🍽️',
    shop: '🛍️',
    hotel: '🏨',
    bathroom: '🚻',
    poi: '📍'
  };
  out.icon = out.icon ?? iconDefaults[type] ?? '📍';
  return out;
}

function renderCard(item, type) {
  const c = accentColors[type];
  const card = document.createElement('div');
  card.className = 'card';
  card.style.animationDelay = `${Math.random() * 0.15}s`;

  let rightHTML = '';
  if (type === 'restaurant') {
    rightHTML = `
      <span class="badge">${item.sub ?? ''}</span>
      <span class="badge">${item.price ?? ''}</span>
      <span class="stars">${starsHTML(item.rating)}</span>
      <span class="dist">📍 ${item.dist ?? '—'}</span>`;
  } else if (type === 'shop') {
    rightHTML = `
      <span class="stars">${starsHTML(item.rating)}</span>
      <span class="dist">📍 ${item.dist ?? '—'}</span>`;
  } else if (type === 'hotel') {
    rightHTML = `
      <span class="badge">${item.price ?? ''}</span>
      <span class="stars">${starsHTML(item.rating)}</span>
      <span class="dist">📍 ${item.dist ?? '—'}</span>`;
  } else if (type === 'bathroom') {
    rightHTML = `
      <span class="badge">${item.sub ?? ''}</span>
      <span class="dist">📍 ${item.dist ?? '—'}</span>`;
  } else {
    rightHTML = `<span class="dist">📍 ${item.dist ?? '—'}</span>`;
  }

  card.innerHTML = `
    <div class="card-icon" style="background:${c.bg}; font-size:20px">${item.icon ?? '📍'}</div>
    <div class="card-body">
      <div class="card-name">${item.name ?? 'Unknown'}</div>
      ${item.sub && type !== 'bathroom' ? `<div class="card-sub">${type === 'restaurant' ? '' : item.sub}</div>` : ''}
    </div>
    <div class="card-right">${rightHTML}</div>
  `;
  return card;
}


// ── Google Maps integration ──────────────────────────────────────────────────
let gmap = null;
let userLocation = null;
let mapCenter = null;
let activeMapMarkers = [];

const DARK_STYLES = [
  { elementType: 'geometry',           stylers: [{ color: '#141820' }] },
  { elementType: 'labels.text.fill',   stylers: [{ color: '#7c7c8a' }] },
  { elementType: 'labels.text.stroke', stylers: [{ color: '#0f0f11' }] },
  { featureType: 'road', elementType: 'geometry', stylers: [{ color: '#222840' }] },
  { featureType: 'water', elementType: 'geometry', stylers: [{ color: '#111a2c' }] },
  { featureType: 'poi', stylers: [{ visibility: 'off' }] }
];

const MAP_MARKER_COLORS = {
  restaurant: '#f97316',
  hotel:      '#a78bfa',
  shop:       '#34d399',
  poi:        '#60a5fa',
  bathroom:   '#94a3b8',
};

async function initMap() {
  const { Map } = await google.maps.importLibrary("maps");
  const loadingEl = document.getElementById('map-loading');

  gmap = new Map(document.getElementById('google-map'), {
    center: { lat: 20.0, lng: 0.0 },
    zoom: 2,
    disableDefaultUI: true,
    styles: DARK_STYLES
  });

  if (loadingEl) loadingEl.style.display = 'none';

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition((pos) => {
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      if (!mapCenter) {
        gmap.setCenter(userLocation);
        gmap.setZoom(13);
      }
      new google.maps.Marker({
        position: userLocation,
        map: gmap,
        title: 'You are here',
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 10, fillColor: '#5b8dff', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2 },
        zIndex: 999
      });
    }, () => {});
  }
}

function wayfinder_mapZoom(delta) {
  if (gmap) gmap.setZoom(gmap.getZoom() + delta);
}

function wayfinder_recenter() {
  if (!gmap) return;
  if (mapCenter) { gmap.setCenter(mapCenter); gmap.setZoom(14); }
  else if (userLocation) { gmap.setCenter(userLocation); gmap.setZoom(13); }
}

function renderPins(type) {
  activeMapMarkers.forEach(m => m.setMap(null));
  activeMapMarkers = [];

  if (!gmap) return;

  const items = data[type] || [];
  const color = MAP_MARKER_COLORS[type] || '#ffffff';

  items.forEach(item => {
    if (!item.lat || !item.lng) return;

    const marker = new google.maps.Marker({
      position: { lat: item.lat, lng: item.lng },
      map: gmap,
      title: item.name,
      icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 1.5 }
    });

    const infoWindow = new google.maps.InfoWindow({
      content: `<div style="background:#1a1d2e;color:#e8e8ec;padding:8px 12px;border-radius:8px;font-family:sans-serif;font-size:13px;min-width:140px;">
        <strong>${item.name}</strong><br/>
        <span style="color:#7c7c8a;">${item.type || type}</span>
        ${item.rating ? `<br/><span style="color:#fbbf24;">&#9733; ${item.rating}</span>` : ''}
        ${item.distance_mi ? `<br/><span style="color:#7c7c8a;">&#128205; ${item.distance_mi} mi</span>` : ''}
      </div>`
    });

    marker.addListener('click', () => infoWindow.open(gmap, marker));
    activeMapMarkers.push(marker);
  });

  if (mapCenter) { gmap.setCenter(mapCenter); gmap.setZoom(14); }
}

function updateMapCenter(placesPayload) {
  if (placesPayload?.center?.lat && placesPayload?.center?.lng && gmap) {
    mapCenter = { lat: placesPayload.center.lat, lng: placesPayload.center.lng };
    if (!currentType) {
      gmap.setCenter(mapCenter);
      gmap.setZoom(14);
    }
  }
}

function selectType(type) {
  currentType = type;
  const items = data[type] || [];
  const list = document.getElementById('results-list');
  const label = document.getElementById('results-label');
  const count = document.getElementById('results-count');
  const colH = document.getElementById('col-headers');

  label.textContent = labels[type] || 'Nearby Locations';
  count.textContent = `${items.length} found`;

  const chRight = document.getElementById('ch-right');
  chRight.innerHTML = (colHeaders[type]?.right || []).map(h => `<span>${h}</span>`).join('');
  colH.style.display = 'flex';

  list.innerHTML = '';
  items.forEach(item => list.appendChild(renderCard(item, type)));

  renderPins(type);

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.type === type);
  });
}

function parsePlacesResultJson(resultJson) {
  try { return JSON.parse(resultJson); } catch (e) { return null; }
}

function applyLatestPayload(latest) {
  data = { restaurant: [], shop: [], hotel: [], bathroom: [], poi: [] };
  const enabledTypes = new Set();

  const toolResults = latest?.tool_results || [];
  const placesRow = toolResults.find(tr => tr.tool_name === 'places');

  if (!placesRow) {
    setButtonsEnabled(new Set());
    setSelectPromptState();
    return;
  }

  const placesPayload = parsePlacesResultJson(placesRow.result_json);
  const items = Array.isArray(placesPayload?.items) ? placesPayload.items : [];

  updateMapCenter(placesPayload);

  for (const item of items) {
    const t = (item?.type || '').toLowerCase();
    if (!data[t]) continue;
    const normalized = _normalizeForUI(item, t);
    data[t].push(normalized);
  }

  Object.keys(data).forEach(t => {
    if ((data[t] || []).length > 0) enabledTypes.add(t);
  });

  setButtonsEnabled(enabledTypes);

  if (currentType && enabledTypes.has(currentType)) {
    selectType(currentType);
  } else {
    setSelectPromptState();
  }
}

async function pollLatest() {
  try {
    const res = await fetch(`/api/latest?ts=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();

    if (!json.ok || !json.latest) {
      lastSubmissionId = null;
      setButtonsEnabled(new Set());
      setEmptyState();
      return;
    }

    const latest = json.latest;

    // If chat hasn't been bound to a submission yet, bind to the first latest we see.
    // This keeps dashboard + chat in sync on first load.
    if (!activeSubmissionId) {
      activeSubmissionId = latest.id;
    }

    if (latest.id !== lastSubmissionId) {
        mapCenter = null;
        activeMapMarkers.forEach(m => m.setMap(null));
        activeMapMarkers = [];
      lastSubmissionId = latest.id;
      currentType = null;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    }

    applyLatestPayload(latest);
  } catch (err) {
    console.warn('pollLatest failed:', err);
  }
}

// ---- Events ----
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (btn.disabled) return;

    if (currentType === btn.dataset.type) {
      currentType = null;
      btn.classList.remove('active');
      document.getElementById('pins').innerHTML = '';
      setSelectPromptState();
    } else {
      selectType(btn.dataset.type);
    }
  });
});

// ---- Init ----
setEmptyState();
pollLatest();
setInterval(pollLatest, 3000);
</script>
</body>
</html>
